[project]
name = "fpl-agent"
version = "0.1.0"
description = "Persistent FPL 2026/27 intelligence system"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pulp>=2.8",
    "psutil>=5.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
fpl = "fpl_agent.cli.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
