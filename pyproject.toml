[project]
name = "fpl-agent"
version = "0.1.0"
description = "Persistent FPL 2026/27 intelligence system"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pulp>=2.8",
    "psutil>=5.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "mypy>=2.3",
    # Real, working visual-verification tool (2026-09-08, Phase 8.0) - the
    # Browser pane's own screenshot capture proved unreliable past ~300px
    # of scroll on this project's own large single-page dashboard;
    # Playwright driven directly against `python -m http.server` (see
    # CLAUDE.md's Phase 8.0 entry) is the real, confirmed-reliable
    # replacement for dashboard visual QA at 1440/1080px. Run
    # `playwright install chromium` once after installing this.
    "playwright>=1.62",
]

[project.scripts]
fpl = "fpl_agent.cli.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Real, correctness-focused subset only (2026-09-07) - not the full default
# rule set, which would surface thousands of pure-style findings across a
# 35k-line codebase in one pass. F = pyflakes (unused imports/vars, undefined
# names, real bugs), E9 = syntax/indentation errors, B = flake8-bugbear (real
# footguns: mutable default args, bare except, etc). Style rules (E/W line-
# length, import order) deliberately excluded - this project's own existing
# formatting is consistent enough that a mechanical reformat would be pure
# churn with no correctness payoff.
select = ["F", "E9", "B"]
ignore = [
    "B008",  # function call in default arg - click options use this idiom throughout main.py
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Real, incremental adoption (2026-09-07) - this codebase has extensive type
# hints already but was never actually checked. Starting in non-strict mode
# (no --strict, no disallow_untyped_defs) so this is a real, immediately-
# runnable safety net rather than a wall of thousands of pre-existing
# findings that would need triaging before the tool is usable at all.
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = false
