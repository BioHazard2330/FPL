# Power gating (2026-10-13, direct user request: the always-on Python processes
# eat CPU/RAM while gaming). Outside the "active window" nothing stays
# resident: one full gather per day (first launch after the machine wakes or
# logs in), then everything exits. Inside the window the sync, live poll and
# dashboard server run continuously. The window is the last `window_lead_hours`
# before a deadline plus every match of the gameweek (a gameweek runs for days).
enabled: true
window_lead_hours: 24
# Keep running a little past the deadline so the locked squad is captured.
post_deadline_grace_hours: 3
# The unattended cycles (run-scheduled, live-match-poll) used to rebuild the old
# Python HTML dashboard (data/dashboard.html) on every cycle: about a minute of
# CPU every 15 minutes, for a page the React app does not read. Off by default;
# the live snapshot the React app reads is still written every cycle, and
# `fpl dashboard` still builds the HTML on request. true restores the old behaviour.
legacy_dashboard_html: false
# Each fixture keeps the window open from `pre_kickoff_minutes` before kickoff
# to `post_match_hours` after it; fixtures less than `matchday_bridge_hours`
# apart are joined, so Friday-to-Monday is one stretch.
pre_kickoff_minutes: 60
post_match_hours: 3
matchday_bridge_hours: 36
# Outside the window an on-demand dashboard server exits after this many idle
# minutes (no request and no open browser tab).
idle_exit_minutes: 30
# The daily run waits while a fullscreen/D3D app (a game) is in the foreground,
# unless the last good run is older than `force_after_hours`.
skip_daily_when_fullscreen: true
force_after_hours: 36
