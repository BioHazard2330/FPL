# Freshness thresholds in minutes. Data older than this is stale, not "live".
# Source: bootstrap spec section 25. Configurable, not hardcoded truths.

price: 60
ownership: 180
fixtures: 360
transfers_preseason: 60
transfers_active_window: 30
injuries_normal: 360
injuries_deadline_day: 30
team_news_normal: 360
team_news_deadline_day: 15
solio: 240  # Solio Analytics states a ~4h model-refresh cadence itself
cross_competition_fixtures: 360  # real cup/UCL/international fixture data changes slowly (a team's own next fixture list rarely shifts within a day) - 6h keeps this a good, free-tier-respecting citizen of FotMob's own public endpoint
api_football_odds: 240  # real, disclosed budget math (2026-09-13): free plan is 100 requests/day flat (not credits); one sync covers ~2-4 distinct upcoming fixture dates (one real request each) within a 14-day horizon, so a 4h cadence stays well under budget even with manual `fpl sync-live-odds` runs on top - the direct lesson from the-odds-api.com's own removed connector, which had NO throttle at all and silently burned a real monthly credit budget in days
